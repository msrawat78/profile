<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <title>Manvirender Singh Rawat — Data &amp; AI Consultant, Trainer &amp; Practitioner</title>
  <meta name="description" content="Independent Data & AI Consultant with 18+ years of experience in analytics strategy, AI/LLM implementation, business intelligence, and enterprise digital transformation. Corporate trainer with 10,000+ professionals trained.">
  <meta name="author" content="Manvirender Singh Rawat">

  <!-- Open Graph / LinkedIn / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://msrawat78.github.io">
  <meta property="og:title" content="Manvirender Singh Rawat — Data & AI Consultant, Trainer & Practitioner">
  <meta property="og:description" content="Independent Data & AI Consultant with 18+ years of experience. Fractional data leader, corporate trainer, and AI practitioner.">
  <meta property="og:image" content="assets/images/og-card.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Manvirender Singh Rawat — Data & AI Consultant">
  <meta name="twitter:description" content="Independent Data & AI Consultant with 18+ years of experience. Fractional data leader, corporate trainer, and AI practitioner.">
  <meta name="twitter:image" content="assets/images/og-card.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Favicon -->
  <link rel="icon" href="assets/icons/favicon.ico" type="image/x-icon">
</head>
<body>

  <!-- ============================================
       HEADER & NAVIGATION
       ============================================ -->
  <header class="site-header" id="site-header">
    <nav class="site-nav container">
      <a class="nav__logo" href="#home" id="nav-logo" aria-label="Home">MSR</a>
      <button class="nav__toggle" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <span class="nav__toggle-bar"></span>
        <span class="nav__toggle-bar"></span>
        <span class="nav__toggle-bar"></span>
      </button>
      <ul class="nav__links" id="nav-links" role="menubar">
        <!-- JS populates navigation links from SITE_DATA.nav -->
      </ul>
    </nav>
  </header>

  <main>

    <!-- ==========================================
         HERO SECTION
         ========================================== -->
    <section id="home" class="hero">
      <div class="container hero__container">
        <div class="hero__content">
          <span class="hero__label" id="hero-title"></span>
          <h1 class="hero__name" id="hero-name"></h1>
          <p class="hero__headline" id="hero-headline"></p>
          <p class="hero__subtext" id="hero-subtext"></p>
          <div class="hero__actions" id="hero-cta">
            <!-- JS populates CTA buttons -->
          </div>
        </div>
      </div>
    </section>

    <!-- ==========================================
         SERVICES / WHAT I DO
         ========================================== -->
    <section id="services" class="section section--light">
      <div class="container">
        <header class="section__header reveal">
          <h2 class="section__title" id="services-title"></h2>
          <p class="section__intro" id="services-intro"></p>
        </header>
        <div class="engagement-paths" id="engagement-paths">
          <!-- JS populates engagement pathway cards -->
        </div>
        <div class="services-grid" id="services-grid">
          <!-- JS populates service cards -->
        </div>
      </div>
    </section>

    <!-- ==========================================
         TRAINING & WORKSHOPS
         ========================================== -->
    <section id="training" class="section section--alt">
      <div class="container">
        <header class="section__header reveal">
          <h2 class="section__title" id="training-title"></h2>
          <p class="section__intro" id="training-intro"></p>
        </header>
        <div class="training__highlights" id="training-highlights">
          <!-- JS populates highlight badges -->
        </div>
        <div class="training__grid" id="training-grid">
          <!-- JS populates training offering cards -->
        </div>
      </div>
    </section>

    <!-- ==========================================
         SELECTED PROJECTS
         ========================================== -->
    <section id="projects" class="section section--light">
      <div class="container">
        <header class="section__header reveal">
          <h2 class="section__title" id="projects-title"></h2>
          <p class="section__intro" id="projects-intro"></p>
        </header>
        <div class="projects-grid" id="projects-grid">
          <!-- JS populates project cards -->
        </div>
      </div>
    </section>

    <!-- ==========================================
         THINGS I'VE BUILT
         ========================================== -->
    <section id="built" class="section section--alt">
      <div class="container">
        <header class="section__header reveal">
          <h2 class="section__title" id="built-title"></h2>
          <p class="section__intro" id="built-intro"></p>
        </header>
        <div class="built-grid" id="built-grid">
          <!-- JS populates built project cards -->
        </div>
      </div>
    </section>

    <!-- ==========================================
         EXPERIENCE & EXPERTISE
         ========================================== -->
    <section id="experience" class="section section--light">
      <div class="container">
        <header class="section__header reveal">
          <h2 class="section__title" id="experience-title"></h2>
          <p class="section__intro" id="experience-intro"></p>
        </header>
        <div class="trust-strip" id="trust-strip">
          <!-- JS populates trust badges -->
        </div>
        <div class="experience__body">
          <div class="experience__timeline" id="experience-timeline">
            <!-- JS populates timeline -->
          </div>
          <div class="experience__sidebar">
            <div class="experience__education" id="experience-education">
              <!-- JS populates education -->
            </div>
            <div class="experience__certifications" id="experience-certifications">
              <!-- JS populates certifications -->
            </div>
            <div class="experience__publications" id="experience-publications">
              <!-- JS populates publications -->
            </div>
          </div>
        </div>
        <div class="experience__skills" id="experience-skills">
          <!-- JS populates skills grid -->
        </div>
      </div>
    </section>

    <!-- ==========================================
         IDEAS & CONTENT
         ========================================== -->
    <section id="ideas" class="section section--alt">
      <div class="container">
        <header class="section__header reveal">
          <h2 class="section__title" id="ideas-title"></h2>
          <p class="section__intro" id="ideas-intro"></p>
        </header>
        <div class="ideas__content" id="ideas-content">
          <!-- JS populates YouTube / articles -->
        </div>
      </div>
    </section>

    <!-- ==========================================
         CONTACT
         ========================================== -->
    <section id="contact" class="section section--dark">
      <div class="container">
        <header class="section__header reveal">
          <h2 class="section__title" id="contact-title"></h2>
          <p class="section__intro" id="contact-intro"></p>
        </header>
        <div class="contact__content" id="contact-content">
          <!-- JS populates contact info, social links, Calendly CTA -->
        </div>
      </div>
    </section>

  </main>

  <!-- ============================================
       FOOTER
       ============================================ -->
  <footer class="site-footer" id="site-footer">
    <div class="container">
      <!-- JS populates footer -->
    </div>
  </footer>

  <!-- Scripts: Data first, then logic -->
  <script src="data/content.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
